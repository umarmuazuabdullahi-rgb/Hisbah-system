<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Rahotanni Na</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-green-600 text-white p-4 flex items-center gap-3">
    <a href="dashboard.html" class="text-white">
      <i class="fas fa-arrow-left"></i>
    </a>
    <h1 class="font-bold text-lg">Rahotanni Na</h1>
  </header>

  <!-- MAIN -->
  <main class="p-4 max-w-3xl mx-auto">

    <div class="bg-white rounded-lg shadow p-4">

      <h2 class="font-bold text-gray-800 mb-3">Dukkan Rahotanni Na</h2>

      <div id="reportsList" class="space-y-3 text-sm text-gray-700">
        <!-- Rahotanni za su shigo nan -->
      </div>

    </div>

  </main>

  <!-- JS LOGIC -->
  <script>
    // MISALI DATA (za a maye gurbinsa da API)
    const reports = [
      { id: 1, type: "Hayaniya", status: "pending", date: "2025-01-10" },
      { id: 2, type: "Shaye-shaye", status: "in-progress", date: "2025-01-08" },
      { id: 3, type: "Faɗa", status: "resolved", date: "2025-01-05" }
    ];

    function loadReports() {
      const list = document.getElementById("reportsList");
      list.innerHTML = "";

      reports.forEach(report => {
        const statusColor =
          report.status === "pending" ? "text-yellow-600" :
          report.status === "in-progress" ? "text-blue-600" :
          "text-green-600";

        const statusText =
          report.status === "pending" ? "Ana dubawa" :
          report.status === "in-progress" ? "Ana aiki" :
          "An kammala";

        list.innerHTML += `
          <div class="border rounded p-3 flex justify-between items-center">
            <div>
              <p class="font-semibold">${report.type}</p>
              <p class="text-xs text-gray-500">${report.date}</p>
            </div>
            <span class="${statusColor} font-semibold">${statusText}</span>
          </div>
        `;
      });
    }

    loadReports();
  </script>

</body>
</html>
