<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-green-700 text-white p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fas fa-user-shield text-xl"></i>
      <span class="font-bold text-lg">Hisbah Admin</span>
    </div>
    <button onclick="logout()" class="text-sm bg-green-800 px-3 py-1 rounded">Fita</button>
  </header>

  <main class="p-4 max-w-7xl mx-auto">
    <div class="mb-4">
      <h1 class="text-xl font-bold text-gray-800">Barka da zuwa Admin 👋</h1>
      <p class="text-sm text-gray-600">Wannan shi ne dashboard ɗinka na gudanarwa</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Jimlar Users</p>
        <h2 class="text-2xl font-bold text-gray-800" id="totalUsers">0</h2>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Jimlar Rahotanni</p>
        <h2 class="text-2xl font-bold text-gray-800" id="totalReports">0</h2>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Rahotanni Ana Dubawa</p>
        <h2 class="text-2xl font-bold text-yellow-600" id="pendingReports">0</h2>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Rahotanni An Kammala</p>
        <h2 class="text-2xl font-bold text-green-600" id="resolvedReports">0</h2>
      </div>
    </div>

    <!-- USERS TABLE -->
    <div class="bg-white rounded-lg shadow p-4 mb-6">
      <h2 class="font-bold text-gray-800 mb-3">Users</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-3 py-2">#</th>
              <th class="px-3 py-2">Suna</th>
              <th class="px-3 py-2">Email</th>
              <th class="px-3 py-2">Role</th>
              <th class="px-3 py-2">Action</th>
            </tr>
          </thead>
          <tbody id="usersList">
            <tr><td colspan="5" class="px-3 py-2 text-gray-500">Ana kokarin daukowa...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- REPORTS TABLE -->
    <div class="bg-white rounded-lg shadow p-4">
      <h2 class="font-bold text-gray-800 mb-3">Rahotanni</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-3 py-2">#</th>
              <th class="px-3 py-2">Nau’i</th>
              <th class="px-3 py-2">User</th>
              <th class="px-3 py-2">Status</th>
              <th class="px-3 py-2">Ranar</th>
              <th class="px-3 py-2">Action</th>
            </tr>
          </thead>
          <tbody id="reportsList">
            <tr><td colspan="6" class="px-3 py-2 text-gray-500">Ana kokarin daukowa...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
<script src="../auth.js"></script> <!-- Lura da ../ anan -->

<script>
  // Kira aikin tsaron admin
  protectAdminRoute();
  
  // Sauran lambobinka...
</script>
  <script>
    function loadDashboard() {
      // Load Users from Firestore
      db.collection("users").get()
        .then((querySnapshot) => {
          const usersList = document.getElementById("usersList");
          usersList.innerHTML = "";
          
          let userCount = 0;
          querySnapshot.forEach((doc) => {
            userCount++;
            const user = doc.data();
            usersList.innerHTML += `
              <tr>
                <td class="px-3 py-2">${userCount}</td>
                <td class="px-3 py-2">${user.name}</td>
                <td class="px-3 py-2">${user.email}</td>
                <td class="px-3 py-2">${user.role}</td>
                <td class="px-3 py-2">
                  <button onclick="deleteUser('${doc.id}')" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs">Goge</button>
                </td>
              </tr>
            `;
          });
          document.getElementById("totalUsers").textContent = userCount;
        });

      // Load Reports from Firestore
      db.collection("reports").orderBy("createdAt", "desc").get()
        .then((querySnapshot) => {
          const reportsList = document.getElementById("reportsList");
          reportsList.innerHTML = "";

          let total = 0, pending = 0, resolved = 0;

          querySnapshot.forEach((doc) => {
            const report = doc.data();
            const reportId = doc.id;
            total++;

            if (report.status === "pending") pending++;
            if (report.status === "resolved") resolved++;

            const statusColor =
              report.status === "pending" ? "text-yellow-600" :
              report.status === "in-progress" ? "text-blue-600" : "text-green-600";

            const statusText =
              report.status === "pending" ? "Ana dubawa" :
              report.status === "in-progress" ? "Ana aiki" : "An kammala";

            reportsList.innerHTML += `
              <tr>
                <td class="px-3 py-2">${total}</td>
                <td class="px-3 py-2">${report.type}</td>
                <td class="px-3 py-2">${report.user}</td>
                <td class="px-3 py-2 ${statusColor} font-semibold">${statusText}</td>
                <td class="px-3 py-2">${report.date}</td>
                <td class="px-3 py-2">
                  <button onclick="deleteReport('${reportId}')" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs">Goge</button>
                </td>
              </tr>
            `;
          });

          document.getElementById("totalReports").textContent = total;
          document.getElementById("pendingReports").textContent = pending;
          document.getElementById("resolvedReports").textContent = resolved;
        });
    }

    function deleteUser(id) {
      if (confirm("Kuna so a goge wannan user?")) {
        db.collection("users").doc(id).delete()
          .then(() => {
            loadDashboard();
            alert("An goge user cikin nasara.");
          });
      }
    }

    function deleteReport(id) {
      if (confirm("Kuna so a goge wannan rahoto?")) {
        db.collection("reports").doc(id).delete()
          .then(() => {
            loadDashboard();
            alert("An goge rahoto cikin nasara.");
          });
      }
    }

    function logout() {
      auth.signOut().then(() => {
        localStorage.removeItem("currentUser");
        window.location.href = "../index.html";
      });
    }

    loadDashboard();
  </script>
</body>
</html>
