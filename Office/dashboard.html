<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Officer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-green-600 text-white p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fas fa-shield-halved text-xl"></i>
      <span class="font-bold text-lg">Hisbah Officer</span>
    </div>
    <button onclick="logout()" class="text-sm bg-green-700 px-3 py-1 rounded">Fita</button>
  </header>

  <main class="p-4 max-w-6xl mx-auto">
    <div class="mb-4">
      <h1 class="text-xl font-bold text-gray-800" id="welcomeOfficer">Barka da zuwa 👋</h1>
      <p class="text-sm text-gray-600">Wannan shi ne officer dashboard ɗinka</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Jimlar Rahotanni</p>
        <h2 class="text-2xl font-bold text-gray-800" id="totalReports">0</h2>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Ana Dubawa</p>
        <h2 class="text-2xl font-bold text-yellow-600" id="pendingReports">0</h2>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Ana Aiki</p>
        <h2 class="text-2xl font-bold text-blue-600" id="inProgressReports">0</h2>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">An Kammala</p>
        <h2 class="text-2xl font-bold text-green-600" id="resolvedReports">0</h2>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow p-4">
      <h2 class="font-bold text-gray-800 mb-3">Rahotanni na Kwanan Nan</h2>
      <div id="reportsList" class="space-y-3 text-sm text-gray-700">
        <p class="text-gray-500">Ana kokarin daukowa...</p>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Lura da ../ a nan -->
  <script src="../firebase-config.js"></script>

  <script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));
    if (currentUser) {
      document.getElementById("welcomeOfficer").textContent = `Barka da zuwa ${currentUser.name} 👋`;
    }

    function loadDashboard() {
      db.collection("reports").orderBy("createdAt", "desc").get()
        .then((querySnapshot) => {
          const list = document.getElementById("reportsList");
          list.innerHTML = "";

          let total = 0, pending = 0, progress = 0, resolved = 0;

          if (querySnapshot.empty) {
            list.innerHTML = "<p class='text-gray-500'>Babu wani rahoto tukuna.</p>";
            return;
          }

          querySnapshot.forEach((doc) => {
            const report = doc.data();
            const reportId = doc.id;
            total++;

            if (report.status === "pending") pending++;
            if (report.status === "in-progress") progress++;
            if (report.status === "resolved") resolved++;

            const statusColor =
              report.status === "pending" ? "text-yellow-600" :
              report.status === "in-progress" ? "text-blue-600" : "text-green-600";

            const statusText =
              report.status === "pending" ? "Ana dubawa" :
              report.status === "in-progress" ? "Ana aiki" : "An kammala";

            list.innerHTML += `
              <div class="border rounded p-3 bg-gray-50 shadow-sm">
                <div class="flex justify-between items-center mb-1">
                  <p class="font-semibold text-base">${report.type}</p>
                  <span class="${statusColor} font-semibold">${statusText}</span>
                </div>
                <p class="text-xs text-gray-500 mb-1">Kwanan Wata: ${report.date} | Wuri: ${report.location}</p>
                <p class="text-sm text-gray-700 mb-2">${report.description}</p>
                <div class="flex gap-2">
                  <button onclick="updateStatus('${reportId}', 'in-progress')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs">✅ Aiki</button>
                  <button onclick="updateStatus('${reportId}', 'resolved')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs">✔ Kammala</button>
                </div>
              </div>
            `;
          });

          document.getElementById("totalReports").textContent = total;
          document.getElementById("pendingReports").textContent = pending;
          document.getElementById("inProgressReports").textContent = progress;
          document.getElementById("resolvedReports").textContent = resolved;
        });
    }

    function updateStatus(id, newStatus) {
      db.collection("reports").doc(id).update({
        status: newStatus
      })
      .then(() => {
        loadDashboard();
        alert("An sabunta matsayin rahoto cikin nasara.");
      })
      .catch((error) => {
        alert("An samu matsala wajen sabuntawa: " + error.message);
      });
    }

    function logout() {
      auth.signOut().then(() => {
        localStorage.removeItem("currentUser");
        window.location.href = "../index.html";
      });
    }

    loadDashboard();
  </script>
</body>
</html>
