<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Shiga Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
    <div class="text-center mb-6">
      <div class="mx-auto w-14 h-14 rounded-full bg-green-600 flex items-center justify-center text-white text-2xl">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-bold mt-3 text-gray-800">Hisbah</h1>
      <p class="text-sm text-gray-500">Shiga Account</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="identifier" placeholder="example@email.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Kalmar Sirri</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required />
      </div>

      <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition">Shiga</button>
    </form>

    <div class="mt-4 flex justify-between text-sm text-gray-600">
      <a href="forgot-password.html" class="hover:underline text-green-600">Manta da kalmar sirri?</a>
      <a href="register.html" class="hover:underline text-green-600 font-semibold">Rajista</a>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;

      errorMsg.classList.add("hidden");

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const uid = userCredential.user.uid;
          return db.collection("users").doc(uid).get();
        })
        .then((doc) => {
          if (doc.exists) {
            const userData = doc.data();
            localStorage.setItem("currentUser", JSON.stringify(userData));
            
            if (userData.role === "admin") {
              window.location.href = "admin/dashboard.html";
            } else if (userData.role === "officer") {
              window.location.href = "officer/dashboard.html";
            } else {
              window.location.href = "dashboard.html";
            }
          } else {
            errorMsg.textContent = "Ba a sami bayanan asusunka ba.";
            errorMsg.classList.remove("hidden");
          }
        })
        .catch((error) => {
          errorMsg.textContent = "Email ko Kalmar sirri ba daidai ba.";
          errorMsg.classList.remove("hidden");
        });
    });
  </script>
</body>
</html>
