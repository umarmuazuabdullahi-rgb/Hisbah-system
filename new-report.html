<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Sabon Rahoto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-green-600 text-white p-4 flex items-center gap-3">
    <a href="dashboard.html" class="text-white"><i class="fas fa-arrow-left"></i></a>
    <h1 class="font-bold text-lg">Sabon Rahoto</h1>
  </header>

  <main class="p-4 max-w-xl mx-auto">
    <div class="bg-white rounded-lg shadow p-4">
      <p class="text-sm text-gray-600 mb-4">Cika bayanan da kyau domin Hisbah ta iya ɗaukar mataki cikin sauri.</p>

      <form id="reportForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nau’in Laifi</label>
          <select id="type" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
            <option value="">-- Zaɓi --</option>
            <option value="hayaniya">Hayaniya</option>
            <option value="shaye-shaye">Shaye-shaye</option>
            <option value="zina">Zina</option>
            <option value="faɗa">Faɗa</option>
            <option value="sata">Sata</option>
            <option value="sauran">Sauran</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Bayani dalla-dalla</label>
          <textarea id="description" rows="4" placeholder="Bayyana abin da ya faru..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Wuri</label>
          <input type="text" id="location" placeholder="Unguwar Tudun Wada" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ranar Faruwa</label>
          <input type="date" id="date" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required />
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="anonymous" class="w-4 h-4">
          <label for="anonymous" class="text-sm text-gray-700">Ina so rahoto ya zama sirri (anonymous)</label>
        </div>

        <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-semibold">Tura Rahoto</button>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const form = document.getElementById("reportForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const type = document.getElementById("type").value;
      const description = document.getElementById("description").value.trim();
      const location = document.getElementById("location").value.trim();
      const date = document.getElementById("date").value;
      const anonymous = document.getElementById("anonymous").checked;

      errorMsg.classList.add("hidden");

      const currentUser = JSON.parse(localStorage.getItem("currentUser"));
      const userId = currentUser ? currentUser.uid : "unknown";
      const userName = anonymous ? "Sirri (Anonymous)" : (currentUser ? currentUser.name : "Citizen");

      const typeNames = {
        hayaniya: "Hayaniya",
        "shaye-shaye": "Shaye-shaye",
        zina: "Zina",
        "faɗa": "Faɗa",
        sata: "Sata",
        sauran: "Sauran"
      };

      db.collection("reports").add({
        userId: userId,
        user: userName,
        type: typeNames[type] || type,
        description: description,
        location: location,
        date: date,
        anonymous: anonymous,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        alert("An tura rahoto cikin nasara.");
        window.location.href = "dashboard.html";
      })
      .catch((error) => {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
      });
    });
  </script>
</body>
</html>
