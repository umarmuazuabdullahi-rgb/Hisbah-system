<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-green-600 text-white p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fas fa-shield-halved text-xl"></i>
      <span class="font-bold text-lg">Hisbah</span>
    </div>
    <button onclick="logout()" class="text-sm bg-green-700 px-3 py-1 rounded">
      Fita
    </button>
  </header>

  <!-- MAIN -->
  <main class="p-4 max-w-6xl mx-auto">

    <!-- WELCOME -->
    <div class="mb-4">
      <h1 class="text-xl font-bold text-gray-800">
        Barka da zuwa 👋
      </h1>
      <p class="text-sm text-gray-600">
        Wannan shi ne dashboard ɗinka
      </p>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Jimlar Rahotanni</p>
        <h2 class="text-2xl font-bold text-gray-800" id="totalReports">0</h2>
      </div>

      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Ana Dubawa</p>
        <h2 class="text-2xl font-bold text-yellow-600" id="pendingReports">0</h2>
      </div>

      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">Ana Aiki</p>
        <h2 class="text-2xl font-bold text-blue-600" id="inProgressReports">0</h2>
      </div>

      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-gray-500">An Kammala</p>
        <h2 class="text-2xl font-bold text-green-600" id="resolvedReports">0</h2>
      </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex gap-3 mb-6">
      <!-- ✅ GYARA LINK -->
      <a href="new-report.html"
         class="flex-1 text-center bg-green-600 text-white py-3 rounded-lg font-semibold">
        ➕ Sabon Rahoto
      </a>

      <a href="my-reports.html"
         class="flex-1 text-center bg-gray-800 text-white py-3 rounded-lg font-semibold">
        📄 Rahotanni Na
      </a>
    </div>

    <!-- RECENT REPORTS -->
    <div class="bg-white rounded-lg shadow p-4">
      <h2 class="font-bold text-gray-800 mb-3">Rahotanni na Kwanan Nan</h2>

      <div id="reportsList" class="space-y-3 text-sm text-gray-700">
        <!-- Reports za su shigo nan -->
      </div>
    </div>

  </main>

  <!-- JS LOGIC -->
  <script>
    // MISALI DATA (za a maye gurbinsa da API)
    const reports = [
      { id: 1, type: "Hayaniya", status: "pending", date: "2025-01-10" },
      { id: 2, type: "Shaye-shaye", status: "in-progress", date: "2025-01-08" },
      { id: 3, type: "Faɗa", status: "resolved", date: "2025-01-05" }
    ];

    function loadDashboard() {
      document.getElementById("totalReports").textContent = reports.length;
      document.getElementById("pendingReports").textContent =
        reports.filter(r => r.status === "pending").length;
      document.getElementById("inProgressReports").textContent =
        reports.filter(r => r.status === "in-progress").length;
      document.getElementById("resolvedReports").textContent =
        reports.filter(r => r.status === "resolved").length;

      const list = document.getElementById("reportsList");
      list.innerHTML = "";

      reports.forEach(report => {
        const statusColor =
          report.status === "pending" ? "text-yellow-600" :
          report.status === "in-progress" ? "text-blue-600" :
          "text-green-600";

        const statusText =
          report.status === "pending" ? "Ana dubawa" :
          report.status === "in-progress" ? "Ana aiki" :
          "An kammala";

        list.innerHTML += `
          <div class="border rounded p-3 flex justify-between items-center">
            <div>
              <p class="font-semibold">${report.type}</p>
              <p class="text-xs text-gray-500">${report.date}</p>
            </div>
            <span class="${statusColor} font-semibold">${statusText}</span>
          </div>
        `;
      });
    }

    function logout() {
      // clear token example
      // localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    loadDashboard();
  </script>

</body>
</html>
