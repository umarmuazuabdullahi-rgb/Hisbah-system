<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Manta da Kalmar Sirri</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">

    <!-- Header -->
    <div class="text-center mb-6">
      <div class="mx-auto w-14 h-14 rounded-full bg-green-600 flex items-center justify-center text-white text-2xl">
        <i class="fas fa-key"></i>
      </div>
      <h1 class="text-2xl font-bold mt-3 text-gray-800">Manta da Kalmar Sirri</h1>
      <p class="text-sm text-gray-500">Za a turo maka OTP</p>
    </div>

    <!-- STEP 1: REQUEST OTP -->
    <form id="requestOtpForm" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Lambar Waya ko Email
        </label>
        <input
          type="text"
          id="identifier"
          placeholder="08012345678 ko email"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          required
        />
      </div>

      <div id="requestError" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>

      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition"
      >
        Tura OTP
      </button>
    </form>

    <!-- STEP 2: VERIFY OTP -->
    <form id="verifyOtpForm" class="space-y-4 hidden mt-6">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Shigar da OTP
        </label>
        <input
          type="text"
          id="otp"
          placeholder="OTP (misali: 123456)"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          required
        />
      </div>

      <div id="otpError" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>

      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition"
      >
        Tabbatar da OTP
      </button>
    </form>

    <!-- STEP 3: RESET PASSWORD -->
    <form id="resetPasswordForm" class="space-y-4 hidden mt-6">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Sabuwar Kalmar Sirri
        </label>
        <input
          type="password"
          id="newPassword"
          placeholder="••••••••"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Tabbatar da Kalmar Sirri
        </label>
        <input
          type="password"
          id="confirmNewPassword"
          placeholder="••••••••"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          required
        />
      </div>

      <div id="resetError" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>

      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition"
      >
        Canja Kalmar Sirri
      </button>
    </form>

    <!-- Footer -->
    <div class="text-center mt-6 text-sm">
      <a href="login.html" class="text-green-600 hover:underline">
        Komawa Shiga Account
      </a>
    </div>

  </div>

  <!-- JS LOGIC -->
  <script>
    const requestForm = document.getElementById("requestOtpForm");
    const verifyForm = document.getElementById("verifyOtpForm");
    const resetForm = document.getElementById("resetPasswordForm");

    requestForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const identifier = document.getElementById("identifier").value.trim();
      const error = document.getElementById("requestError");

      if (!identifier) {
        error.textContent = "Da fatan a shigar da waya ko email.";
        error.classList.remove("hidden");
        return;
      }

      error.classList.add("hidden");

      // API example:
      // POST /api/auth/request-otp
      console.log("REQUEST OTP:", identifier);

      alert("An turo OTP (misali).");
      requestForm.classList.add("hidden");
      verifyForm.classList.remove("hidden");
    });

    verifyForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const otp = document.getElementById("otp").value.trim();
      const error = document.getElementById("otpError");

      if (otp.length < 4) {
        error.textContent = "OTP bai cika ba.";
        error.classList.remove("hidden");
        return;
      }

      error.classList.add("hidden");

      // API example:
      // POST /api/auth/verify-otp
      console.log("VERIFY OTP:", otp);

      alert("OTP ya tabbata (misali).");
      verifyForm.classList.add("hidden");
      resetForm.classList.remove("hidden");
    });

    resetForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const newPass = document.getElementById("newPassword").value;
      const confirmPass = document.getElementById("confirmNewPassword").value;
      const error = document.getElementById("resetError");

      if (newPass !== confirmPass) {
        error.textContent = "Kalmar sirri ba ta yi daidai ba.";
        error.classList.remove("hidden");
        return;
      }

      if (newPass.length < 6) {
        error.textContent = "Kalmar sirri ta kasance akalla haruffa 6.";
        error.classList.remove("hidden");
        return;
      }

      error.classList.add("hidden");

      // API example:
      // POST /api/auth/reset-password
      console.log("RESET PASSWORD:", newPass);

      alert("An canja kalmar sirri cikin nasara.");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
