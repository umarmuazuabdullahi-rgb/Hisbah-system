<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hisbah – Manta da Kalmar Sirri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
    <div class="text-center mb-6">
      <div class="mx-auto w-14 h-14 rounded-full bg-green-600 flex items-center justify-center text-white text-2xl">
        <i class="fas fa-key"></i>
      </div>
      <h1 class="text-2xl font-bold mt-3 text-gray-800">Manta da Kalmar Sirri</h1>
      <p class="text-sm text-gray-500">Za a turo maka link ta Email</p>
    </div>

    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Shigar da Email Address</label>
        <input type="email" id="email" placeholder="example@email.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required />
      </div>

      <div id="msg" class="hidden text-sm p-2 rounded"></div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition">Tura Link na Gyara</button>
    </form>

    <div class="text-center mt-6 text-sm">
      <a href="index.html" class="text-green-600 hover:underline">Komawa Shiga Account</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const form = document.getElementById("resetForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      msg.classList.add("hidden");

      auth.sendPasswordResetEmail(email)
        .then(() => {
          msg.textContent = "An tura link din canza kalmar sirri zuwa email dinka. Duba Inbox ko Spam.";
          msg.className = "text-sm text-green-700 bg-green-50 p-2 rounded block";
        })
        .catch((error) => {
          msg.textContent = error.message;
          msg.className = "text-sm text-red-600 bg-red-50 p-2 rounded block";
        });
    });
  </script>
</body>
</html>
